function sgs(l){$('#sg').innerHTML=(l||[]).slice(0,4).map(function(s){return '<button data-fill="'+esc(s)+'">'+esc(s)+'</button>'}).join('')}
/* ===== تصحيح محلي مختصر ===== */
var RU=[[/\bje suis (\d{1,2}) ans\b/gi,"j'ai $1 ans",'العمر يُقال بالفعل avoir: j’ai … ans.'],[/\bje suis (faim|soif|peur|sommeil)\b/gi,"j'ai $1",'مع faim وsoif وpeur نستعمل avoir.'],[/\bje (?=[aeiouéèêh])/gi,"j'",'je قبل حرف علة تصبح j’.'],[/(^|\s)à le\b/gi,'$1au','à + le = au'],[/\bde le\b/gi,'du','de + le = du'],[/\bca\b/g,'ça','تُكتب بسيدية: ça'],[/\bce est\b/gi,"c'est",'ce + est = c’est']];
function fix(t){var c=t.replace(/[’‘`´]/g,"'"),is=[];RU.forEach(function(r){c=c.replace(r[0],function(){var m=arguments,n=r[1].replace(/\$(\d)/g,function(_,d){return m[+d]||''});is.push({wrong:m[0].trim(),right:n.trim(),why:r[2]});return n})});return is}
function showFix(box,is){if(is.length)box.innerHTML='<div class="fx">✏️ <b>تصحيح:</b>'+is.map(function(i){return '<div><s dir="ltr">'+esc(i.wrong)+'</s> ← <u dir="ltr">'+esc(i.right)+'</u> — '+esc(i.why)+'</div>'}).join('')+'</div>'}
/* ===== العقل المحلي ===== */
var DAY=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'],MON=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function P(a){return{fr:a[0],ar:a[1]}}
function topicQ(){var t=S.tp;if(!t)return null;var l=(t.q[ST.lv]||t.q.b);if(S.qi>=l.length){S.tp=null;chips();return null}var q=l[S.qi++];return{parts:[{fr:q[0],ar:q[1]}],sug:q[2]||[]}}
function setTopic(t){S.tp=t;S.qi=0;chips();var h=t.hello&&(t.hello[ST.lv]||t.hello.b);return h&&h[0]?P(h):{fr:'Parlons de ce sujet !',ar:'لنتحدث عن هذا الموضوع!'}}
function surprise(){var l=D.topics.filter(function(t){return !S.tp||t.id!==S.tp.id});return pick(l)}
function extract(t){var s=t.replace(/[’‘`´]/g,"'").toLowerCase(),m,o={};
 if(m=s.match(/(?:je m'appelle|mon nom est|moi c'est)\s+([a-zà-ÿ'-]{2,20})/))o.name=m[1][0].toUpperCase()+m[1].slice(1);
 if(m=s.match(/j'ai\s+(\d{1,2})\s+ans/))o.age=m[1];
 if(m=s.match(/j'habite\s+(?:à|au|en|dans)\s+(?:la\s+|le\s+|l')?([a-zà-ÿ-]{2,24})/))o.city=m[1];
 if(m=s.match(/(?:j'aime|j'adore|je préfère)\s+(?:le |la |les |l'|un |une |du |de la |des )?([a-zà-ÿ' -]{3,24})/))o.like=m[1].trim();return o}
function follow(t){var s=t.replace(/[’‘`´]/g,"'").toLowerCase().replace(/[.!?]+$/,''),m;
 if(m=s.match(/(?:j'adore|j'aime)\s+(.{3,30})/))return{fr:'Pourquoi aimes-tu '+m[1]+' ? Raconte-moi !',ar:'لماذا تحب ذلك؟ احكِ لي!'};
 if(m=s.match(/(?:je n'aime pas|je déteste)\s+(.{3,30})/))return{fr:'Ah bon ? Qu’est-ce qui ne te plaît pas dans '+m[1]+' ?',ar:'حقًّا؟ ما الذي لا يعجبك في ذلك؟'};
 if(m=s.match(/je suis (triste|fatigué|fatiguée|content|contente|heureux|heureuse|stressé|stressée|malade)/))return{fr:/triste|fatigu|stress|malade/.test(m[1])?'Oh, je suis désolée. Qu’est-ce qui se passe ?':'Génial ! Qu’est-ce qui te rend '+m[1]+' ?',ar:'ما السبب؟ أخبرني.'};
 if(m=s.match(/(?:je voudrais|je veux|mon rêve)\s+(.{3,40})/))return{fr:'Quel beau projet ! Comment vas-tu y arriver ?',ar:'مشروع جميل! كيف ستحققه؟'};
 if(m=s.match(/(?:parce que|car)\s+(.{3,})/))return{fr:'Ah, je comprends ton idée. Et qu’en penses-tu vraiment ?',ar:'فهمت فكرتك. وما رأيك حقًّا؟'};
 return null}
function special(t){var f=fold(t).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(),n=new Date(),m;
 if(S.riddle){var r=S.riddle;S.riddle=null;if(f.indexOf(r[2])>-1){ST.xp+=10;return{parts:[{fr:'Bravo ! C’était « '+r[2]+' ». Tu es très fort !',ar:'أحسنت! الإجابة صحيحة.'}]}}return{parts:[{fr:'Presque ! La réponse était : « '+r[2]+' ». On rejoue ?',ar:'تقريبًا! الإجابة: '+r[2]}]}}
 if(/^(bonjour|salut|coucou|bonsoir|hello)\b/.test(f)&&f.split(' ').length<=4)return{parts:[{fr:'Bonjour'+(ST.f.name?' '+ST.f.name:'')+' ! Je suis contente de te voir. Comment ça va ?',ar:'مرحبًا! سعيدة برؤيتك. كيف حالك؟'}]};
 if(/(comment (ca )?va|ca va\b|tu vas bien)/.test(f))return{parts:[{fr:'Je vais très bien, merci ! Et toi, comment te sens-tu aujourd’hui ?',ar:'بخير، شكرًا! وأنت كيف تشعر اليوم؟'}]};
 if(/(comment tu t appelles|ton nom|qui es tu)/.test(f))return{parts:[{fr:'Je m’appelle Zoza ! Je suis ton amie et ta professeure de français.',ar:'اسمي زوزا! صديقتك ومعلّمتك للفرنسية.'}]};
 if(/quelle heure/.test(f))return{parts:[{fr:'Il est '+n.getHours()+' heures '+n.getMinutes()+'.',ar:'الساعة الآن '+n.getHours()+':'+('0'+n.getMinutes()).slice(-2)}]};
 if(/(quel jour|quelle date|on est quel)/.test(f))return{parts:[{fr:'Nous sommes '+DAY[n.getDay()]+' '+n.getDate()+' '+MON[n.getMonth()]+' '+n.getFullYear()+'.',ar:'التاريخ اليوم.'}]};
 if(/blague|drole/.test(f))return{parts:[P(pick(D.jokes))],sug:['Ha ha !','Encore une !']};
 if(/proverbe|dicton|sagesse/.test(f))return{parts:[P(pick(D.sayings))]};
 if(/virelangue/.test(f))return{parts:[P(pick(D.twisters))],sug:['Répète lentement']};
 if(/devinette|enigme/.test(f)){S.riddle=pick(RID);return{parts:[{fr:S.riddle[0],ar:S.riddle[1]}]}}
 if(/^(merci)/.test(f))return{parts:[{fr:'De rien ! C’est un plaisir.',ar:'عفوًا! يسعدني ذلك.'}]};
 if(/(au revoir|bonne nuit|a bientot|bye)/.test(f))return{parts:[{fr:'Au revoir ! À très bientôt, tu as très bien parlé aujourd’hui !',ar:'إلى اللقاء! أحسنت اليوم.'}]};
 if(/(repete|plus lentement|je ne comprends pas)/.test(f)&&S.last){ST.slow=1;chips();return{parts:[{fr:S.last.fr,ar:'سأكرر ببطء: '+S.last.ar}]}}
 if(m=f.match(/combien (?:font|fait) (\d+) (plus|moins|fois) (\d+)/)){var a=+m[1],b=+m[3],r=m[2]==='plus'?a+b:m[2]==='moins'?a-b:a*b;return{parts:[{fr:a+' '+m[2]+' '+b+', ça fait '+r+' !',ar:'الناتج '+r}]}}
 return null}
function localReply(t){var fc=extract(t),k;for(k in fc)ST.f[k]=fc[k];save();
 var sp=special(t);if(sp)return sp;var f=fold(t),toks=f.split(/[^a-z]+/),best=null,bs=0;
 D.topics.forEach(function(tp){var sc=tp.kw.filter(function(w){return toks.indexOf(w)>-1}).length;if(sc>bs){bs=sc;best=tp}});
 var parts=[],sug=[];
 if(best&&(!S.tp||S.tp.id!==best.id)){parts.push(P(pick(D.react.pos)));parts.push(setTopic(best))}
 else{var neg=/(n'aime pas|deteste|triste|fatigue|difficile|ennuy)/.test(f),pos=/(j'aime|j'adore|super|genial|content|heureux)/.test(f);
  parts.push(fc.name?{fr:'Enchantée, '+fc.name+' ! Quel joli prénom.',ar:'تشرفت بمعرفتك!'}:fc.age?{fr:fc.age+' ans, c’est un bel âge !',ar:'سنّ جميلة!'}:P(pick(f.split(/\s+/).length>=7?D.react.long:neg&&!pos?D.react.neg:pos?D.react.pos:D.react.neu)));
  var fl=follow(t);if(fl&&S.turns%2===0){parts.push(fl);return{parts:parts,sug:['Parce que…','Je ne sais pas.']}}}
 if(ST.f.name&&S.turns%5===4&&ST.f.like)parts.push({fr:'Au fait '+ST.f.name+', tu m’as dit que tu aimes '+ST.f.like+'. Dis-m’en plus !',ar:'ذكرتَ أنك تحب ذلك. أخبرني المزيد!'});
 else{var q=topicQ();if(!q){var nt=surprise();parts.push({fr:'Changeons de sujet !',ar:'لنغيّر الموضوع!'});parts.push(setTopic(nt));q=topicQ()}if(q){parts=parts.concat(q.parts);sug=q.sug}}
 return{parts:parts,sug:sug}}
/* ===== الذكاء الاصطناعي (اختياري) ===== */
function url(){return window.ZOZA_AI_URL||AI_URL||ST.ai||''}
function askAI(t){var c=window.AbortController?new AbortController():null,to=setTimeout(function(){c&&c.abort()},15000);
 return fetch(url(),{method:'POST',headers:{'Content-Type':'application/json'},signal:c?c.signal:undefined,body:JSON.stringify({message:t,history:S.hist.slice(-20),level:ST.lv,topic:S.tp?S.tp.fr:'',name:ST.f.name||'',facts:ST.f})}).then(function(r){clearTimeout(to);if(!r.ok)throw 0;return r.json()})}
/* ===== معالجة الرسالة ===== */
function done(){busy=0;if(ST.hands)setTimeout(listen,250);else setState('idle')}
function handle(t){t=String(t||'').trim();if(!t||busy)return;busy=1;try{rec&&rec.abort()}catch(e){}stopSpeak();
 var box=addU(t);S.hist.push({role:'user',content:t});S.turns++;ST.xp+=3;save();
 if(!isAr(t))showFix(box,fix(t));setState('think');A.tb=-5;$('#cap').textContent='';
 var out=function(r){setTimeout(function(){addZ(r.parts,r.sug,done)},500+Math.min(700,t.length*8))};
 if(url())askAI(t).then(function(r){var parts=[{fr:r.reply_fr||'',ar:r.reply_ar||''}];if(r.tip_ar)parts.push({fr:'',ar:'💡 '+r.tip_ar});
   if((r.corrections||[]).length)box.innerHTML='<div class="fx">✏️ <b>ملاحظات زوزا:</b>'+r.corrections.map(function(c){return '<div><s dir="ltr">'+esc(c.wrong)+'</s> ← <u dir="ltr">'+esc(c.right)+'</u> — '+esc(c.why_ar||'')+'</div>'}).join('')+'</div>';
   out({parts:parts,sug:r.suggestions_fr})}).catch(function(){out(localReply(t))});
 else out(localReply(t))}
function startTopic(id){var r;busy=1;stopSpeak();try{rec&&rec.abort()}catch(e){}
 if(id==='*'){r=setTopic(surprise());var q=topicQ();addZ([r].concat(q?q.parts:[]),q?q.sug:[],done);return}
 if(id==='joke'){addZ([P(pick(D.jokes))],['Ha ha !','Encore une !'],done);return}
 if(id==='wise'){addZ([P(pick(D.sayings))],['C’est joli !'],done);return}
 if(id==='twist'){addZ([P(pick(D.twisters)),{fr:'',ar:'جرّب أن تكررها بصوتك!'}],['Je répète !'],done);return}
 if(id==='riddle'){S.riddle=pick(RID);addZ([{fr:S.riddle[0],ar:S.riddle[1]}],[],done);return}
 var t=D.topics.filter(function(x){return x.id===id})[0];r=setTopic(t);var q2=topicQ();addZ([r].concat(q2.parts),q2.sug,done)}
$('#snd').onclick=function(){var v=$('#ip').value;$('#ip').value='';handle(v)};
$('#ip').onkeydown=function(e){if(e.key==='Enter'){var v=this.value;this.value='';handle(v)}};
document.addEventListener('click',function(e){var x=e.target.closest('button');if(!x)return;var d=x.dataset;
 if(d.lv){ST.lv=d.lv;save();chips()}else if(d.tp)startTopic(d.tp);else if(d.say){busy=1;speak(d.say,done)}
 else if(d.fill){handle(d.fill)}
 else if(d.tg==='ai'){var v=prompt('ألصق رابط zoza-worker (https://…) أو اتركه فارغًا للوضع المحلي:',ST.ai||'');if(v!==null){ST.ai=v.trim();save();note(ST.ai?'تم تفعيل العقل الذكي ✅':'الوضع المحلي')}}
 else if(d.tg){ST[d.tg]=ST[d.tg]?0:1;save();chips();if(d.tg==='tr')document.querySelectorAll('[data-ar]').forEach(function(a){a.hidden=!ST.tr});if(d.tg==='voice'&&!ST.voice)stopSpeak()}});
/* ===== الإقلاع ===== */
function ready(){D.topics=D.topics.concat(X.map(norm));chips();mic();setState('idle');
 var n=ST.f.name;addZ([{fr:'Bonjour'+(n?' '+n:'')+' ! Je suis Zoza, ton amie. Appuie sur le micro et parlons français ensemble !',ar:'مرحبًا! أنا زوزا صديقتك. اضغط على الميكروفون ولنتحدث بالفرنسية معًا!'}],['Bonjour Zoza !','Je m’appelle …'],function(){busy=0;if(ST.hands)listen()})}
busy=1;fetch('data/talk.json').then(function(r){return r.json()}).then(function(j){D.levels=j.levels?Object.keys(j.levels).reduce(function(o,k){o[k]=j.levels[k];return o},{}):D.levels;D.topics=j.topics||[];['react','jokes','sayings','twisters'].forEach(function(k){if(j[k])D[k]=j[k]})}).catch(function(){}).then(ready);
})();
</script></body></html>
