<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7c3aed">
  <title>حوار مع صديقتي Zoza</title>

  <!-- ملفات التنسيق الأساسية -->
  <link rel="stylesheet" href="./styles.css">
  
  <style>
    /* تنسيقات خاصة لتجربة محادثة زوزا في صفحة مستقلة بكامل الشاشة */
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #fdf2f8, #eef2ff);
      font-family: Tahoma, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .zoza-main-wrapper {
      max-width: 700px;
      width: 100%;
      margin: 20px auto;
      padding: 10px;
      box-sizing: border-box;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .site-footer {
      text-align: center;
      padding: 15px;
      font-size: 0.8rem;
      color: #6b7280;
      background: rgba(255, 255, 255, 0.7);
      border-top: 1px solid #e9d5ff;
    }
  </style>
</head>
<body>

  <!-- شاشة قفل الحماية (تظهر أولاً وتختفي عند إدخال بيانات صحيحة) -->
  <div id="auth-lock-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; z-index: 999999; display: flex; justify-content: center; align-items: center; font-family: Tahoma, sans-serif;">
    <div style="background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 350px; text-align: right; direction: rtl;">
      <h2 style="margin-bottom: 20px; color: #333; text-align: center; font-size: 20px;">تسجيل الدخول للتطبيق</h2>
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; color: #666; font-size: 14px;">اسم المستخدم</label>
        <input type="text" id="auth-username" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px;" placeholder="أدخل اسم المستخدم">
      </div>
      <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 5px; color: #666; font-size: 14px;">الرقم السري</label>
        <input type="password" id="auth-password" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px;" placeholder="أدخل الرقم السري">
      </div>
      <button onclick="checkAuthCredentials()" style="width: 100%; padding: 12px; background: #7c3aed; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold;">دخول</button>
      <p id="auth-error-msg" style="color: #dc3545; text-align: center; margin-top: 15px; font-size: 14px; display: none;">بيانات الدخول غير صحيحة!</p>
    </div>
  </div>

  <div class="zoza-main-wrapper">
    <!-- قسم حوار مع صديقتي Zoza كاملاً كما هو دون أي نقص -->
    <section id="soon-geographie" class="sec on" style="display: block !important;">
      <h2 style="text-align: center; color: #7c3aed; margin-bottom: 15px;">💬 حوار مع صديقتي Zoza</h2>
      <div id="talk-root">
        <div class="empty">جارٍ تحميل زوزا…</div>
      </div>
    </section>
  </div>

  <footer class="site-footer">
    <p>جميع الحقوق محفوظة © - إعداد وتطوير: مسيو/ محمود أبوبكر السويدى</p>
  </footer>

  <!-- ملفات الجافاسكريبت وبيانات زوزا كاملة -->
  <script src="./zoza.js?v=20261104"></script>
  <script src="./zoza-talk.js?v=20261104"></script>

  <!-- سكربت التحقق من بيانات الدخول -->
  <script>
    function checkAuthCredentials() {
        var user = document.getElementById('auth-username').value;
        var pass = document.getElementById('auth-password').value;
        
        if (user === 'admin' && pass === '000519') {
            document.getElementById('auth-lock-screen').style.display = 'none';
            sessionStorage.setItem('isAppAuthenticated', 'true');
        } else {
            var errorMsg = document.getElementById('auth-error-msg');
            errorMsg.style.display = 'block';
        }
    }

    // السماح بالدخول تلقائياً طوال الجلسة الحالية إذا تم إدخال البيانات مسبقاً
    window.addEventListener('DOMContentLoaded', function() {
        if (sessionStorage.getItem('isAppAuthenticated') === 'true') {
            document.getElementById('auth-lock-screen').style.display = 'none';
        }
    });
  </script>

</body>
</html>
